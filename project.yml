# Source of truth for Nyx.xcodeproj. Change targets or build settings here, then run `xcodegen generate`.
# Source folders are synchronized folders: adding or removing files needs no regeneration.
name: Nyx
options:
  bundleIdPrefix: com.harrypakhale
  deploymentTarget:
    iOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: DUHVN68KBA
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  Nyx:
    type: application
    platform: iOS
    sources:
      - path: Nyx
    info:
      path: Config/Nyx-Info.plist
      properties:
        # Version keys follow the build settings, so a static plist value can never ship an old build number.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [nyx]
        # Custom keys are not expanded from INFOPLIST_KEY_* settings; this one must live in the plist.
        NPS_API_KEY: "$(NPS_API_KEY)"
        UILaunchScreen:
          UIImageName: LaunchStars
          UIColorName: LaunchBlack
    configFiles:
      Debug: Config/Nyx.xcconfig
      Release: Config/Nyx.xcconfig
    dependencies:
      - target: NyxWidgets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx
        PRODUCT_NAME: Nyx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Nyx uses your location on this iPhone to find nearby national parks. Your coordinates are never sent to a service.
        CODE_SIGN_ENTITLEMENTS: Config/Nyx.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  NyxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NyxWidgets
      - path: Nyx/DesignSystem/TonightWidgetView.swift
      - path: Nyx/DesignSystem/MoonDisc.swift
      - path: Nyx/DesignSystem/NyxTheme.swift
      - path: Nyx/DesignSystem/Starfield.swift
      - path: Nyx/DesignSystem/RealSky.swift
      - path: Nyx/DesignSystem/MotionTilt.swift
      - path: Nyx/Resources/stars.json
      - path: Nyx/Models/Park.swift
      - path: Nyx/Models/SkyConditions.swift
      - path: Nyx/Services/AstronomyEngine.swift
      - path: Nyx/Services/SkyAlmanac.swift
      - path: Nyx/Services/WhatsUp.swift
      - path: Nyx/Resources/sky-events.json
      - path: Nyx/Services/ScoreEngine.swift
      - path: Nyx/Services/DataServices.swift
      - path: Nyx/Services/ForecastDetail.swift
      - path: Nyx/Services/SharedSettings.swift
      - path: Nyx/Intents/NightVisionIntent.swift
      - path: Nyx/Resources/parks.json
      - path: Nyx/Resources/Localizable.xcstrings
    info:
      path: Config/NyxWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        CODE_SIGN_ENTITLEMENTS: Config/NyxWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  NyxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NyxTests
    dependencies:
      - target: Nyx
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.tests
        GENERATE_INFOPLIST_FILE: YES
  NyxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NyxUITests
    dependencies:
      - target: Nyx
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Nyx
schemes:
  Nyx:
    build:
      targets:
        Nyx: all
        NyxTests: [test]
        NyxUITests: [test]
    test:
      targets:
        - NyxTests
        - NyxUITests
    run:
      config: Debug
    archive:
      config: Release
