# Source of truth for Nyx.xcodeproj. Change targets or build settings here, then run `xcodegen generate`.
# Source folders are synchronized folders: adding or removing files needs no regeneration.
name: Nyx
options:
  bundleIdPrefix: com.harrypakhale
  deploymentTarget:
    iOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: DUHVN68KBA
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Nyx:
    type: application
    platform: iOS
    sources:
      - path: Nyx
    dependencies:
      - target: NyxWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx
        PRODUCT_NAME: Nyx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Config/Nyx.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  NyxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NyxWidgets
    info:
      path: Config/NyxWidgets-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        CODE_SIGN_ENTITLEMENTS: Config/NyxWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        ENABLE_PREVIEWS: YES
  NyxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NyxTests
    dependencies:
      - target: Nyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nyx:
    build:
      targets:
        Nyx: all
        NyxTests: [test]
    test:
      targets:
        - NyxTests
    run:
      config: Debug
    archive:
      config: Release
