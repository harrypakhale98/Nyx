# Source of truth for Nyx.xcodeproj. Change targets or build settings here, then run `xcodegen generate`.
# Source folders are synchronized folders: adding or removing files needs no regeneration.
name: Nyx
options:
  bundleIdPrefix: com.harrypakhale
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    visionOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
# Single files shared into the extensions, the watch and Vision Pro carry `group: Shared`. Without it each
# one builds an intermediate "Nyx" (or "NyxVision", "NyxVisionWidgets") group beside the synchronized folder
# of the same name, and xcodegen orders those same-named siblings differently from run to run. Names inside
# Shared stay unique (the visionOS string catalogue sits in Shared/visionOS) so the output is byte-stable.
settings:
  base:
    SWIFT_VERSION: "6.0"
    # iPhone and iPad for every iOS target (the widget extension must match the app to embed for iPad);
    # the watch and Vision Pro targets set their own.
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: DUHVN68KBA
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.10"
    CURRENT_PROJECT_VERSION: "34"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    SWIFT_APPROACHABLE_CONCURRENCY: YES
  # Warnings fail Debug builds (every local and CI build and test), never a Release archive: a new
  # deprecation in an Xcode point release must not block a launch-day fix.
  configs:
    Debug:
      GCC_TREAT_WARNINGS_AS_ERRORS: YES
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  Nyx:
    type: application
    platform: iOS
    sources:
      - path: Nyx
    info:
      path: Config/Nyx-Info.plist
      properties:
        # Version keys follow the build settings, so a static plist value can never ship an old build number.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [nyx]
        # Custom keys are not expanded from INFOPLIST_KEY_* settings; this one must live in the plist.
        NPS_API_KEY: "$(NPS_API_KEY)"
        # Field mode: the night's countdown on the Lock Screen and in the Dynamic Island (computed on the phone, no push).
        NSSupportsLiveActivities: true
        # Field mode's wake-ups (AlarmKit). Shown by iOS when the first alarm is set, after Nyx's own explainer.
        NSAlarmKitUsageDescription: "Nyx sets alarms you choose for moments in the night, like the Milky Way's core rising. They are set on this device only."
        UILaunchScreen:
          UIImageName: LaunchStars
          UIColorName: LaunchBlack
        # One background mode: about every six hours iOS may let Nyx refresh saved parks' clouds (and
        # park alerts when due) on the same hosts, then rewrite the widget, the watch and reminders.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.harrypakhale.nyx.refresh]
        # Custom animation (the time river, the gauge's count-up) may run at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Assistive Access: Nyx's own simplified scene (`AssistiveAccess`), listed under Optimized Apps.
        UISupportsAssistiveAccess: true
        # Journal export: a private package Nyx writes and reads back (Journal → Export / Import).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.harrypakhale.nyx.journal
            UTTypeDescription: Nyx Journal
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [nyxjournal]
          # A park dragged between Nyx's screens and windows (iPad): only the park id travels.
          - UTTypeIdentifier: com.harrypakhale.nyx.park
            UTTypeDescription: Nyx Park
            UTTypeConformsTo: [public.data]
          # A night dragged from Plan's month onto the Journal (iPad): only the place's id and the night's day travel.
          - UTTypeIdentifier: com.harrypakhale.nyx.night
            UTTypeDescription: Nyx Night
            UTTypeConformsTo: [public.data]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Nyx Journal
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.harrypakhale.nyx.journal]
        # Opened journals are copied in and merged; the original file is never edited in place.
        LSSupportsOpeningDocumentsInPlace: false
        # Handoff: a park and night from park detail to Nyx on the person's other devices (`ParkHandoff`).
        NSUserActivityTypes: [com.harrypakhale.nyx.park]
    configFiles:
      Debug: Config/Nyx.xcconfig
      Release: Config/Nyx.xcconfig
    dependencies:
      - target: NyxWidgets
      # The companion watch app, embedded in Watch/; built for the matching watch simulator or device.
      - target: NyxWatch
    settings:
      base:
        # iPhone and iPad. The phone takes portrait and landscape (iPhone Duo's guidance: a Duo propped on
        # its edge reads in landscape, and its inner display ignores the lock anyway); iPad takes every
        # orientation and any window size (iPadOS 26 windowing; `UIRequiresFullScreen` is deprecated and not
        # set). Layout follows size classes and the window's own size, never the device.
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Nyx uses your location on this device to find parks and dark-sky places near you, notice when you are at a U.S. national park, point the sky to true north, and turn night vision on at dusk where you are. It stays on this device unless you save where you stand as a spot; then that spot's position, rounded to about 7 miles (11 km), is used for its cloud forecast.
        # "Where to look by sound" in field mode: AirPods head motion turns the tone with your head (CMHeadphoneMotionManager).
        # Plan's "Add all to Calendar" (the next six months): write-only, so Nyx adds events and never sees the calendar.
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: Nyx adds the dark nights you choose to your calendar. It can add events only; it never sees your calendar.
        INFOPLIST_KEY_NSMotionUsageDescription: Nyx follows how your head turns through headphones that track motion, so the tone in field mode stays toward the part of the sky you chose. Motion never leaves this device.
        CODE_SIGN_ENTITLEMENTS: Config/Nyx.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings → App icon: the Moon's other phases, each its own Icon Composer document in Resources.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconNew AppIconQuarter AppIconFull"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  NyxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NyxWidgets
      - path: Nyx/DesignSystem/TonightWidgetView.swift
        group: Shared
      - path: Nyx/DesignSystem/MoonDisc.swift
        group: Shared
      - path: Nyx/DesignSystem/MoonSymbol.swift
        group: Shared
      - path: Nyx/DesignSystem/NyxTheme.swift
        group: Shared
      - path: Nyx/DesignSystem/NightLook.swift
        group: Shared
      - path: Nyx/DesignSystem/NyxPalette.swift
        group: Shared
      - path: Nyx/DesignSystem/Starfield.swift
        group: Shared
      - path: Nyx/DesignSystem/RealSky.swift
        group: Shared
      - path: Nyx/DesignSystem/MotionTilt.swift
        group: Shared
      - path: Nyx/Resources/stars.json
        group: Shared
      - path: Nyx/Models/Park.swift
        group: Shared
      - path: Nyx/Services/Sentences.swift
        group: Shared
      - path: Nyx/Models/SkyConditions.swift
        group: Shared
      - path: Nyx/Services/AstronomyEngine.swift
        group: Shared
      - path: Nyx/Services/SkyAlmanac.swift
        group: Shared
      - path: Nyx/Services/WhatsUp.swift
        group: Shared
      # The binocular sights What's up reads (type only: the file is not bundled, so it offers none here).
      - path: Nyx/Services/DeepSky.swift
        group: Shared
      # The terrain horizon What's up reads (type only: no profiles bundled here).
      - path: Nyx/Services/Horizon.swift
        group: Shared
      - path: Nyx/Resources/sky-events.json
        group: Shared
      - path: Nyx/Services/ScoreEngine.swift
        group: Shared
      # The aurora outlook the watch context carries (the widget never shows it); without the grid the
      # geomagnetic latitude falls back to the dipole, which nothing here reads. No network code: the
      # widgets read what the app cached in the App Group and never make a request.
      - path: Nyx/Services/Aurora.swift
        group: Shared
      - path: Nyx/Services/Geomagnetic.swift
        group: Shared
      - path: Nyx/Models/Forecast.swift
        group: Shared
      - path: Nyx/Services/ForecastDetail.swift
        group: Shared
      - path: Nyx/Services/SharedSettings.swift
        group: Shared
      - path: Nyx/Intents/NightVisionIntent.swift
        group: Shared
      - path: Nyx/Intents/FieldModeIntent.swift
        group: Shared
      - path: Nyx/Intents/WidgetParkIntent.swift
        group: Shared
      # The park choice for the Tonight and Moon widgets and the Tonight control.
      - path: Nyx/Intents/ParkEntity.swift
        group: Shared
      - path: Nyx/DesignSystem/MoonWidgetView.swift
        group: Shared
      # `MoonNow` (the Moon widget's phase, rise and set), shared with the watch's Moon complication.
      - path: Nyx/Services/WristSky.swift
        group: Shared
      - path: Nyx/Services/WatchContext.swift
        group: Shared
      - path: Nyx/Services/NightPlanner.swift
        group: Shared
      - path: Nyx/Models/CloudClimate.swift
        group: Shared
      - path: Nyx/Services/SkyGrid.swift
        group: Shared
      - path: Nyx/Resources/cloud-climate.json
        group: Shared
      # Measured sky glow breaks ties between equal scores (`NightPlanner.glowRank`).
      - path: Nyx/Resources/skyglow.json
        group: Shared
      - path: Nyx/DesignSystem/SkyGlyph.swift
        group: Shared
      - path: Nyx/Models/FieldActivity.swift
        group: Shared
      - path: Nyx/DesignSystem/FieldActivityView.swift
        group: Shared
      - path: Nyx/Resources/parks.json
        group: Shared
      - path: Nyx/Resources/Localizable.xcstrings
        group: Shared
    info:
      path: Config/NyxWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        CODE_SIGN_ENTITLEMENTS: Config/NyxWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Apple Watch: a single-target watch app and its complications. The engine is shared by listing
  # files; DataServices.swift (the network) is deliberately absent: the watch makes no requests.
  NyxWatch:
    type: application
    platform: watchOS
    sources:
      - path: NyxWatch
      - path: NyxWatchShared
      # The place id rule links and the watch's own links share (`PlaceIDText`).
      - path: Nyx/Models/PlaceIDText.swift
        group: Shared
      - path: Nyx/Models/Park.swift
        group: Shared
      - path: Nyx/Services/Sentences.swift
        group: Shared
      - path: Nyx/Models/SkyConditions.swift
        group: Shared
      - path: Nyx/Models/Forecast.swift
        group: Shared
      - path: Nyx/Services/AstronomyEngine.swift
        group: Shared
      - path: Nyx/Services/ScoreEngine.swift
        group: Shared
      # One rule for a night everywhere (`NightPlanner.night`): usual clouds where no forecast reaches.
      - path: Nyx/Services/NightPlanner.swift
        group: Shared
      - path: Nyx/Models/CloudClimate.swift
        group: Shared
      - path: Nyx/Services/SkyGrid.swift
        group: Shared
      - path: Nyx/Resources/cloud-climate.json
        group: Shared
      - path: Nyx/Resources/skyglow.json
        group: Shared
      - path: Nyx/Services/ForecastDetail.swift
        group: Shared
      - path: Nyx/Services/SharedSettings.swift
        group: Shared
      - path: Nyx/Services/WatchContext.swift
        group: Shared
      # The iPhone's Moon pictures for the dial (`WatchMoons`): the watch cannot run the Moon shader.
      - path: Nyx/Services/WatchMoons.swift
        group: Shared
      # DEBUG only (the whole file): the iPhone's forecast fixture, for the watch's models' range debug screen.
      - path: Nyx/App/DebugForecasts.swift
        group: Shared
      - path: Nyx/DesignSystem/MoonDisc.swift
        group: Shared
      - path: Nyx/DesignSystem/MoonSymbol.swift
        group: Shared
      - path: Nyx/Services/WristSky.swift
        group: Shared
      - path: Nyx/DesignSystem/NyxTheme.swift
        group: Shared
      - path: Nyx/DesignSystem/NightLook.swift
        group: Shared
      - path: Nyx/DesignSystem/NyxPalette.swift
        group: Shared
      - path: Nyx/DesignSystem/Starfield.swift
        group: Shared
      - path: Nyx/DesignSystem/RealSky.swift
        group: Shared
      - path: Nyx/Services/SkyAlmanac.swift
        group: Shared
      - path: Nyx/Services/WhatsUp.swift
        group: Shared
      # Tonight's binocular sights in What's up, from the same bundled list as the iPhone.
      - path: Nyx/Services/DeepSky.swift
        group: Shared
      - path: Nyx/Resources/deep-sky.json
        group: Shared
      # The real terrain at each park's main viewing spot, for the core's line in What's up, as on the iPhone.
      - path: Nyx/Services/Horizon.swift
        group: Shared
      - path: Nyx/Resources/horizons.json
        group: Shared
      # Aurora in reach tonight from the Kp forecast the iPhone hands over (`WatchContext.aurora`),
      # by the same corrected geomagnetic latitude grid as the iPhone, so both say the same.
      - path: Nyx/Services/Aurora.swift
        group: Shared
      - path: Nyx/Services/Geomagnetic.swift
        group: Shared
      - path: Nyx/Resources/geomagnetic.bin
        group: Shared
      - path: Nyx/Resources/sky-events.json
        group: Shared
      - path: Nyx/DesignSystem/MotionTilt.swift
        group: Shared
      # The dial face's geometry (numeral and band word clear of the ticks), shared with the tests.
      - path: Nyx/DesignSystem/WatchDialFace.swift
        group: Shared
      # The iPhone's night on the dial (`NightTrack`), so the face is one object across devices.
      - path: Nyx/DesignSystem/NightRing.swift
        group: Shared
      # The best window, amber on that track, by the iPhone's rule from the clouds it hands over.
      - path: Nyx/Services/ClearWindow.swift
        group: Shared
      - path: Nyx/Resources/stars.json
        group: Shared
      - path: Nyx/Resources/parks.json
        group: Shared
      - path: Nyx/Resources/Localizable.xcstrings
        group: Shared
    dependencies:
      - target: NyxWatchWidgets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.harrypakhale.nyx
        # Not independent: the watch has no network and gets saved parks and clouds from Nyx on iPhone,
        # so it installs with the iPhone app rather than alone from the watch's App Store.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Config/NyxWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  NyxWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: NyxWatchWidgets
      - path: NyxWatchShared
      # The place id rule links and the watch's own links share (`PlaceIDText`).
      - path: Nyx/Models/PlaceIDText.swift
        group: Shared
      - path: Nyx/Models/Park.swift
        group: Shared
      - path: Nyx/Services/Sentences.swift
        group: Shared
      - path: Nyx/Models/SkyConditions.swift
        group: Shared
      - path: Nyx/Models/Forecast.swift
        group: Shared
      - path: Nyx/Services/AstronomyEngine.swift
        group: Shared
      - path: Nyx/Services/ScoreEngine.swift
        group: Shared
      # One rule for a night everywhere (`NightPlanner.night`): usual clouds where no forecast reaches.
      - path: Nyx/Services/NightPlanner.swift
        group: Shared
      - path: Nyx/Models/CloudClimate.swift
        group: Shared
      - path: Nyx/Services/SkyGrid.swift
        group: Shared
      - path: Nyx/Resources/cloud-climate.json
        group: Shared
      - path: Nyx/Resources/skyglow.json
        group: Shared
      - path: Nyx/Services/ForecastDetail.swift
        group: Shared
      - path: Nyx/Services/SharedSettings.swift
        group: Shared
      - path: Nyx/Services/WatchContext.swift
        group: Shared
      # The aurora forecast the context carries (its type only; complications do not show aurora).
      - path: Nyx/Services/Aurora.swift
        group: Shared
      - path: Nyx/Services/Geomagnetic.swift
        group: Shared
      - path: Nyx/DesignSystem/MoonSymbol.swift
        group: Shared
      - path: Nyx/Services/WristSky.swift
        group: Shared
      # Night vision on the face (`NightLook`), without the app's views and sky in NyxTheme.swift.
      - path: Nyx/DesignSystem/NightLook.swift
        group: Shared
      - path: Nyx/DesignSystem/NyxPalette.swift
        group: Shared
      # `NightPlanner.month` reads the shower and eclipse table (the iPhone's large widget asks for it).
      - path: Nyx/Services/SkyAlmanac.swift
        group: Shared
      - path: Nyx/Services/WhatsUp.swift
        group: Shared
      # The binocular sights What's up reads (type only: the file is not bundled, so it offers none here).
      - path: Nyx/Services/DeepSky.swift
        group: Shared
      # The terrain horizon What's up reads (type only: no profiles bundled here).
      - path: Nyx/Services/Horizon.swift
        group: Shared
      - path: Nyx/Resources/sky-events.json
        group: Shared
      - path: Nyx/Resources/parks.json
        group: Shared
      - path: Nyx/Resources/Localizable.xcstrings
        group: Shared
    info:
      path: Config/NyxWatchWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        CODE_SIGN_ENTITLEMENTS: Config/NyxWatchWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        # The same isolation as every other target, so shared files compile identically everywhere.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Nyx for Apple Vision Pro: the planner's window and "Stand under the sky". Shares the engine and
  # bundled data by listing files. Its requests are the iPhone's, to the same four hosts, each behind
  # its own switch in Your privacy: the cloud forecast (CloudForecastClient.swift), and the smoke
  # forecast, park alerts and aurora forecast (DataServices.swift), so its scores, closures and
  # What's up match (see PRIVACY.md).
  NyxVision:
    type: application
    platform: visionOS
    sources:
      - path: NyxVision
      # Smoke (`ForecastDetailService`, air only) and park alerts (`ParkStore`), with the types they cache.
      - path: Nyx/Services/DataServices.swift
        group: Shared
      # NOAA's aurora forecast (`AuroraService`, behind its own switch) and the grid that places it, as on the iPhone.
      - path: Nyx/Services/Aurora.swift
        group: Shared
      - path: Nyx/Services/Geomagnetic.swift
        group: Shared
      - path: Nyx/Resources/geomagnetic.bin
        group: Shared
      - path: Nyx/Models/Campground.swift
        group: Shared
      # Which alert is a closure, its headline in Nyx's words, and the line beside the score.
      - path: Nyx/Services/ParkAlerts.swift
        group: Shared
      # What the headset's score counts, and what it says when smoke or alerts are missing.
      - path: Nyx/Services/ScoreInputs.swift
        group: Shared
      - path: Nyx/Models/Park.swift
        group: Shared
      - path: Nyx/Services/Sentences.swift
        group: Shared
      - path: Nyx/Models/SkyConditions.swift
        group: Shared
      # `MoonPhase.symbolName`: the phase symbol every device uses.
      - path: Nyx/DesignSystem/MoonSymbol.swift
        group: Shared
      - path: Nyx/Services/AstronomyEngine.swift
        group: Shared
      - path: Nyx/Services/ScoreEngine.swift
        group: Shared
      # The phone's night rule (`NightPlanner.night`): the forecast where it reaches, usual clouds beyond.
      - path: Nyx/Services/NightPlanner.swift
        group: Shared
      # The darkest of the next 14 nights and the week of Moons, shared and tested on the iPhone.
      - path: Nyx/Services/NightsAhead.swift
        group: Shared
      - path: Nyx/Services/LittleDipper.swift
        group: Shared
      - path: Nyx/Services/MoonWeek.swift
        group: Shared
      - path: Nyx/Services/CloudForecastClient.swift
        group: Shared
      - path: Nyx/Models/CloudClimate.swift
        group: Shared
      # The usual night temperatures (ERA5), the curated parks' file; the world grid is iPhone-only, as the clouds grid is.
      - path: Nyx/Models/NightClimate.swift
        group: Shared
      - path: Nyx/Resources/night-climate.json
        group: Shared
      - path: Nyx/Services/SkyGrid.swift
        group: Shared
      - path: Nyx/Models/Forecast.swift
        group: Shared
      - path: Nyx/Services/ForecastDetail.swift
        group: Shared
      - path: Nyx/Resources/cloud-climate.json
        group: Shared
      # The sky-glow ranking `NightPlanner.glowRank` breaks equal scores with, so parks order as on the iPhone and watch.
      - path: Nyx/Resources/skyglow.json
        group: Shared
      - path: Nyx/Services/SkyAlmanac.swift
        group: Shared
      - path: Nyx/Services/WhatsUp.swift
        group: Shared
      # Tonight's binocular sights in What's up, from the same bundled list as the iPhone.
      - path: Nyx/Services/DeepSky.swift
        group: Shared
      - path: Nyx/Resources/deep-sky.json
        group: Shared
      # The real terrain: the core's line in What's up and the immersive skyline.
      - path: Nyx/Services/Horizon.swift
        group: Shared
      - path: Nyx/Resources/horizons.json
        group: Shared
      - path: Nyx/Services/SkyDome.swift
        group: Shared
      - path: Nyx/DesignSystem/Moon.metal
        group: Shared
      # The Moon's shared size and relief rules, and the globe's grid (window Moon and Moon volume).
      - path: Nyx/DesignSystem/MoonShading.swift
        group: Shared
      # The Moon's named seas and craters over the window's Moon, as on the iPhone.
      - path: Nyx/DesignSystem/MoonFeatures.swift
        group: Shared
      - path: Nyx/Resources/moon-features.json
        group: Shared
      # The palette, night-vision red and spring every Nyx target shares (`VisionPalette` derives from them).
      - path: Nyx/DesignSystem/NyxPalette.swift
        group: Shared
      # The iPhone's constellation loader, for the planner's loading state.
      - path: Nyx/DesignSystem/ConstellationTrace.swift
        group: Shared
      # The large Moon's atlas (colour and LOLA relief), for the window's Moon from 120 pt. The app
      # only: the visionOS widget keeps the small MoonMap (SharedAssets.xcassets).
      - path: Nyx/Resources/MoonRelief.xcassets
        group: Shared
      - path: Nyx/Resources/stars.json
        group: Shared
      # Star names and figures, shared with Tonight's sky on iPhone and iPad.
      - path: Nyx/Services/SkyLore.swift
        group: Shared
      - path: Nyx/Resources/star-names.json
        group: Shared
      - path: Nyx/Resources/constellations.json
        group: Shared
      - path: Nyx/Resources/parks.json
        group: Shared
      - path: Nyx/Resources/sky-events.json
        group: Shared
      # `MoonMap` and the accent colour, and nothing else of the iPhone's catalogue (its icon
      # previews and launch art stay on the iPhone).
      - path: Nyx/Resources/SharedAssets.xcassets
        group: Shared
      # The widget's faces, compiled into the app too for its DEBUG renders of them.
      - path: NyxVisionWidgets/MoonWidgetFace.swift
        group: Shared
      # Handoff from park detail on iPhone or iPad: that park and night in the window.
      - path: Nyx/Models/ParkHandoff.swift
        group: Shared
      - path: Nyx/Models/PlaceIDText.swift
        group: Shared
    # Linked so the App Intents metadata step finds its framework instead of warning on every build
    # ("Metadata extraction skipped"). The window's own intents (Siri and Shortcuts: a park's score, open a park, stand under tonight's sky) live in NyxVision/Intents.
    dependencies:
      - sdk: AppIntents.framework
      - target: NyxVisionWidgets
    info:
      path: Config/NyxVision-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSUserActivityTypes: [com.harrypakhale.nyx.park]
        # The iPhone's shared NPS key (Config/Nyx.xcconfig, Secrets.xcconfig); empty, closures are simply not checked.
        NPS_API_KEY: "$(NPS_API_KEY)"
    configFiles:
      Debug: Config/Nyx.xcconfig
      Release: Config/Nyx.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "7"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  # The visionOS widget: tonight's Moon and the next new moon, from the date alone. No App Group,
  # no saved parks, no network transport compiled in.
  NyxVisionWidgets:
    type: app-extension
    platform: visionOS
    sources:
      - path: NyxVisionWidgets
      # The large face's week of Moons and next new moon, from the date alone.
      - path: Nyx/Services/MoonWeek.swift
        group: Shared
      - path: Nyx/Models/Park.swift
        group: Shared
      - path: Nyx/Services/Sentences.swift
        group: Shared
      - path: Nyx/Models/SkyConditions.swift
        group: Shared
      # `MoonPhase.symbolName`: the phase symbol every device uses.
      - path: Nyx/DesignSystem/MoonSymbol.swift
        group: Shared
      - path: Nyx/Services/AstronomyEngine.swift
        group: Shared
      - path: Nyx/DesignSystem/Moon.metal
        group: Shared
      # For `MoonMap` (the catalogue holds it and the accent colour, no app icon).
      - path: Nyx/Resources/SharedAssets.xcassets
        group: Shared
      # Starlight, amber and indigo from the one palette.
      - path: Nyx/DesignSystem/NyxPalette.swift
        group: Shared
      - path: NyxVision/Resources/Localizable.xcstrings
        group: Shared/visionOS
    info:
      path: Config/NyxVisionWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "7"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  NyxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NyxTests
    dependencies:
      - target: Nyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.tests
        GENERATE_INFOPLIST_FILE: YES
  NyxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NyxUITests
    dependencies:
      - target: Nyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Nyx
schemes:
  Nyx:
    build:
      targets:
        Nyx: all
        NyxTests: [test]
        NyxUITests: [test]
    test:
      # Unit and UI tests in one plan, with a single Default configuration (English, US).
      testPlans:
        - path: Nyx.xctestplan
          defaultPlan: true
    run:
      config: Debug
    archive:
      config: Release
  NyxWatch:
    build:
      targets:
        NyxWatch: all
  NyxVision:
    build:
      targets:
        NyxVision: all
    run:
      config: Debug
    archive:
      config: Release
