# Source of truth for Nyx.xcodeproj. Change targets or build settings here, then run `xcodegen generate`.
# Source folders are synchronized folders: adding or removing files needs no regeneration.
name: Nyx
options:
  bundleIdPrefix: com.harrypakhale
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    visionOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: DUHVN68KBA
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "7"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    SWIFT_APPROACHABLE_CONCURRENCY: YES
  # Warnings fail Debug builds (every local and CI build and test), never a Release archive: a new
  # deprecation in an Xcode point release must not block a launch-day fix.
  configs:
    Debug:
      GCC_TREAT_WARNINGS_AS_ERRORS: YES
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  Nyx:
    type: application
    platform: iOS
    sources:
      - path: Nyx
    info:
      path: Config/Nyx-Info.plist
      properties:
        # Version keys follow the build settings, so a static plist value can never ship an old build number.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [nyx]
        # Custom keys are not expanded from INFOPLIST_KEY_* settings; this one must live in the plist.
        NPS_API_KEY: "$(NPS_API_KEY)"
        # Field mode: the night's countdown on the Lock Screen and in the Dynamic Island (computed on the phone, no push).
        NSSupportsLiveActivities: true
        # Field mode's wake-ups (AlarmKit). Shown by iOS when the first alarm is set, after Nyx's own explainer.
        NSAlarmKitUsageDescription: "Nyx sets alarms you choose for moments in the night, like the Milky Way's core rising. They are set on this device only."
        UILaunchScreen:
          UIImageName: LaunchStars
          UIColorName: LaunchBlack
        # One background mode: about every six hours iOS may let Nyx refresh saved parks' clouds (and
        # park alerts when due) on the same hosts, then rewrite the widget, the watch and reminders.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.harrypakhale.nyx.refresh]
        # Custom animation (the time river, the gauge's count-up) may run at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Journal export: a private package Nyx writes and reads back (Journal → Export / Import).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.harrypakhale.nyx.journal
            UTTypeDescription: Nyx Journal
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [nyxjournal]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Nyx Journal
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.harrypakhale.nyx.journal]
        # Opened journals are copied in and merged; the original file is never edited in place.
        LSSupportsOpeningDocumentsInPlace: false
    configFiles:
      Debug: Config/Nyx.xcconfig
      Release: Config/Nyx.xcconfig
    dependencies:
      - target: NyxWidgets
      # The companion watch app, embedded in Watch/; built for the matching watch simulator or device.
      - target: NyxWatch
    settings:
      base:
        # iPhone and iPad. The phone stays portrait; iPad takes every orientation and any window size
        # (iPadOS 26 windowing; `UIRequiresFullScreen` is deprecated and not set). Layout follows size classes.
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx
        PRODUCT_NAME: Nyx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Nyx uses your location on this device to find nearby national parks, notice when you are at one, and point the sky to true north. Your location never leaves this device.
        CODE_SIGN_ENTITLEMENTS: Config/Nyx.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings → App icon: the Moon's other phases, each its own Icon Composer document in Resources.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconNew AppIconQuarter AppIconFull"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  NyxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NyxWidgets
      - path: Nyx/DesignSystem/TonightWidgetView.swift
      - path: Nyx/DesignSystem/MoonDisc.swift
      - path: Nyx/DesignSystem/MoonSymbol.swift
      - path: Nyx/DesignSystem/NyxTheme.swift
      - path: Nyx/DesignSystem/Starfield.swift
      - path: Nyx/DesignSystem/RealSky.swift
      - path: Nyx/DesignSystem/MotionTilt.swift
      - path: Nyx/Resources/stars.json
      - path: Nyx/Models/Park.swift
      - path: Nyx/Models/SkyConditions.swift
      - path: Nyx/Services/AstronomyEngine.swift
      - path: Nyx/Services/SkyAlmanac.swift
      - path: Nyx/Services/WhatsUp.swift
      - path: Nyx/Resources/sky-events.json
      - path: Nyx/Services/ScoreEngine.swift
      - path: Nyx/Services/DataServices.swift
      # The campground types `ParkStore` reads and caches (the widget never asks for them).
      - path: Nyx/Models/Campground.swift
      - path: Nyx/Services/CloudForecastClient.swift
      - path: Nyx/Models/Forecast.swift
      - path: Nyx/Services/ForecastDetail.swift
      - path: Nyx/Services/SharedSettings.swift
      - path: Nyx/Intents/NightVisionIntent.swift
      - path: Nyx/Intents/FieldModeIntent.swift
      - path: Nyx/Intents/WidgetParkIntent.swift
      - path: Nyx/Services/NightPlanner.swift
      - path: Nyx/Models/CloudClimate.swift
      - path: Nyx/Resources/cloud-climate.json
      # Measured sky glow breaks ties between equal scores (`NightPlanner.glowRank`).
      - path: Nyx/Resources/skyglow.json
      - path: Nyx/DesignSystem/SkyGlyph.swift
      - path: Nyx/Models/FieldActivity.swift
      - path: Nyx/DesignSystem/FieldActivityView.swift
      - path: Nyx/Resources/parks.json
      - path: Nyx/Resources/Localizable.xcstrings
    info:
      path: Config/NyxWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # Must match the app's families, or the extension cannot be embedded for iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        CODE_SIGN_ENTITLEMENTS: Config/NyxWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Apple Watch: a single-target watch app and its complications. The engine is shared by listing
  # files; DataServices.swift (the network) is deliberately absent: the watch makes no requests.
  NyxWatch:
    type: application
    platform: watchOS
    sources:
      - path: NyxWatch
      - path: NyxWatchShared
      - path: Nyx/Models/Park.swift
      - path: Nyx/Models/SkyConditions.swift
      - path: Nyx/Models/Forecast.swift
      - path: Nyx/Services/AstronomyEngine.swift
      - path: Nyx/Services/ScoreEngine.swift
      # One rule for a night everywhere (`NightPlanner.night`): usual clouds where no forecast reaches.
      - path: Nyx/Services/NightPlanner.swift
      - path: Nyx/Models/CloudClimate.swift
      - path: Nyx/Resources/cloud-climate.json
      - path: Nyx/Resources/skyglow.json
      - path: Nyx/Services/ForecastDetail.swift
      - path: Nyx/Services/SharedSettings.swift
      - path: Nyx/Services/WatchContext.swift
      - path: Nyx/DesignSystem/MoonDisc.swift
      - path: Nyx/DesignSystem/MoonSymbol.swift
      - path: Nyx/Services/WristSky.swift
      - path: Nyx/DesignSystem/NyxTheme.swift
      - path: Nyx/DesignSystem/Starfield.swift
      - path: Nyx/DesignSystem/RealSky.swift
      - path: Nyx/Services/SkyAlmanac.swift
      - path: Nyx/Services/WhatsUp.swift
      - path: Nyx/Resources/sky-events.json
      - path: Nyx/DesignSystem/MotionTilt.swift
      - path: Nyx/Resources/stars.json
      - path: Nyx/Resources/parks.json
      - path: Nyx/Resources/Localizable.xcstrings
    dependencies:
      - target: NyxWatchWidgets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.watchkitapp
        PRODUCT_NAME: NyxWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.harrypakhale.nyx
        # Not independent: the watch has no network and gets saved parks and clouds from Nyx on iPhone,
        # so it installs with the iPhone app rather than alone from the watch's App Store.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Config/NyxWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  NyxWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: NyxWatchWidgets
      - path: NyxWatchShared
      - path: Nyx/Models/Park.swift
      - path: Nyx/Models/SkyConditions.swift
      - path: Nyx/Models/Forecast.swift
      - path: Nyx/Services/AstronomyEngine.swift
      - path: Nyx/Services/ScoreEngine.swift
      # One rule for a night everywhere (`NightPlanner.night`): usual clouds where no forecast reaches.
      - path: Nyx/Services/NightPlanner.swift
      - path: Nyx/Models/CloudClimate.swift
      - path: Nyx/Resources/cloud-climate.json
      - path: Nyx/Resources/skyglow.json
      - path: Nyx/Services/ForecastDetail.swift
      - path: Nyx/Services/SharedSettings.swift
      - path: Nyx/Services/WatchContext.swift
      - path: Nyx/DesignSystem/MoonDisc.swift
      - path: Nyx/DesignSystem/MoonSymbol.swift
      - path: Nyx/Services/WristSky.swift
      - path: Nyx/DesignSystem/NyxTheme.swift
      - path: Nyx/DesignSystem/Starfield.swift
      - path: Nyx/DesignSystem/RealSky.swift
      - path: Nyx/Services/SkyAlmanac.swift
      - path: Nyx/Services/WhatsUp.swift
      - path: Nyx/Resources/sky-events.json
      - path: Nyx/DesignSystem/MotionTilt.swift
      - path: Nyx/Resources/stars.json
      - path: Nyx/Resources/parks.json
      - path: Nyx/Resources/Localizable.xcstrings
    info:
      path: Config/NyxWatchWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        CODE_SIGN_ENTITLEMENTS: Config/NyxWatchWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        # The same isolation as every other target, so shared files compile identically everywhere.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Nyx for Apple Vision Pro: the planner's window and "Stand under the sky". Shares the engine and
  # bundled data by listing files. Its one network request is the cloud forecast from
  # api.open-meteo.com, behind its own switch (approved 2026-10-07): CloudForecastClient.swift only,
  # never DataServices.swift (park updates, smoke), so no other host is compiled in (see PRIVACY.md).
  NyxVision:
    type: application
    platform: visionOS
    sources:
      - path: NyxVision
      - path: Nyx/Models/Park.swift
      - path: Nyx/Models/SkyConditions.swift
      - path: Nyx/Services/AstronomyEngine.swift
      - path: Nyx/Services/ScoreEngine.swift
      # The phone's night rule (`NightPlanner.night`): the forecast where it reaches, usual clouds beyond.
      - path: Nyx/Services/NightPlanner.swift
      - path: Nyx/Services/CloudForecastClient.swift
      - path: Nyx/Models/CloudClimate.swift
      - path: Nyx/Models/Forecast.swift
      - path: Nyx/Services/ForecastDetail.swift
      - path: Nyx/Resources/cloud-climate.json
      - path: Nyx/Services/SkyAlmanac.swift
      - path: Nyx/Services/WhatsUp.swift
      - path: Nyx/Services/SkyDome.swift
      - path: Nyx/DesignSystem/Moon.metal
      - path: Nyx/Resources/stars.json
      - path: Nyx/Resources/parks.json
      - path: Nyx/Resources/sky-events.json
      - path: Nyx/Resources/Assets.xcassets
      # The widget's faces, compiled into the app too for its DEBUG renders of them.
      - path: NyxVisionWidgets/MoonWidgetFace.swift
    # Linked so the App Intents metadata step finds its framework instead of warning on every build
    # ("Metadata extraction skipped"). The window has no intents of its own yet; linking costs nothing.
    dependencies:
      - sdk: AppIntents.framework
      - target: NyxVisionWidgets
    info:
      path: Config/NyxVision-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "7"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx
        PRODUCT_NAME: NyxVision
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  # The visionOS widget: tonight's Moon and the next new moon, from the date alone. No App Group,
  # no saved parks, no network transport compiled in (as in the app).
  NyxVisionWidgets:
    type: app-extension
    platform: visionOS
    sources:
      - path: NyxVisionWidgets
      - path: Nyx/Models/Park.swift
      - path: Nyx/Models/SkyConditions.swift
      - path: Nyx/Services/AstronomyEngine.swift
      - path: Nyx/DesignSystem/Moon.metal
      # For `MoonMap` (the catalogue is small and holds no app icon).
      - path: Nyx/Resources/Assets.xcassets
      - path: NyxVision/Resources/Localizable.xcstrings
    info:
      path: Config/NyxVisionWidgets-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "7"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nyx
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
  NyxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NyxTests
    dependencies:
      - target: Nyx
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.tests
        GENERATE_INFOPLIST_FILE: YES
  NyxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NyxUITests
    dependencies:
      - target: Nyx
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.nyx.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Nyx
schemes:
  Nyx:
    build:
      targets:
        Nyx: all
        NyxTests: [test]
        NyxUITests: [test]
    test:
      # Unit and UI tests, plus a Release-like configuration (optimised, no warnings-as-errors).
      testPlans:
        - path: Nyx.xctestplan
          defaultPlan: true
    run:
      config: Debug
    archive:
      config: Release
  NyxWatch:
    build:
      targets:
        NyxWatch: all
  NyxVision:
    build:
      targets:
        NyxVision: all
    run:
      config: Debug
    archive:
      config: Release
